# One-command demo: PostgreSQL + API + frontend, with demo data loaded on start.
# The API is built straight from the market_fastapi repository on GitHub, so only Docker is
# needed. To use a local backend checkout instead: API_CONTEXT=../market_fastapi docker compose up
name: resale-market-demo

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: ${API_CONTEXT:-https://github.com/andreiyurik/market_fastapi.git#main}
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      BACKEND_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-5173}"]'
    # Apply migrations, reset the demo data, then start the API.
    command: sh -c "alembic upgrade head && python -m scripts.seed && exec fastapi run app/main.py --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
